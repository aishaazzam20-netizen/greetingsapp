<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق التحيات الفصيحة التفاعلي</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background 1.2s ease-in-out;
      overflow: hidden;
      position: relative;
    }

    /* خلفيات النهار والليل والمنقسمة */
    body.day-theme {
      background: linear-gradient(to bottom, #38bdf8, #bae6fd, #fef08a);
    }
    body.night-theme {
      background: linear-gradient(to bottom, #0f172a, #1e1b4b, #312e81);
    }
    body.split-theme {
      background: linear-gradient(to left, #38bdf8 0%, #38bdf8 50%, #0f172a 50%, #0f172a 100%);
    }

    /* عناصر السماء */
    .sky-element {
      position: absolute;
      top: 40px;
      right: 10%;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      transition: all 1s ease-in-out;
      z-index: 1;
    }
    .day-theme .sky-element {
      background: #facc15;
      box-shadow: 0 0 50px #fde047;
    }
    .night-theme .sky-element {
      background: #f1f5f9;
      box-shadow: 0 0 30px #cbd5e1;
    }
    .split-theme .sky-element {
      background: #facc15;
      box-shadow: 0 0 40px #fde047;
      right: 15%;
    }

    .moon-split {
      position: absolute;
      top: 40px;
      left: 15%;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f1f5f9;
      box-shadow: 0 0 30px #cbd5e1;
      display: none;
      z-index: 1;
    }
    .split-theme .moon-split {
      display: block;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 150px 160px, #ddd, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
    }
    .night-theme .stars { opacity: 1; }
    .split-theme .stars { opacity: 0.6; clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }

    /* الهيدر والتوقيع */
    .header-author {
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 18px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      z-index: 10;
      letter-spacing: 0.5px;
    }

    /* بطاقة التطبيق */
    .app-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      width: 95%;
      max-width: 580px;
      border-radius: 28px;
      padding: 25px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
      text-align: center;
      z-index: 10;
    }

    h1 {
      color: #0f172a;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 18px;
    }

    /* الشخصيات */
    .characters-stage {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      height: 175px;
      margin-bottom: 18px;
    }

    .human-character {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.4s ease;
      opacity: 0.55;
      transform: scale(0.9);
    }
    .human-character.active {
      opacity: 1;
      transform: scale(1.1);
    }

    .head {
      width: 75px;
      height: 85px;
      background: #fde047;
      border-radius: 38px 38px 32px 32px;
      position: relative;
      border: 3px solid #334155;
    }
    .hair-mohamed {
      position: absolute;
      top: -10px;
      width: 79px;
      height: 28px;
      background: #1e293b;
      border-radius: 20px 20px 0 0;
    }
    .hair-omar {
      position: absolute;
      top: -10px;
      width: 79px;
      height: 30px;
      background: #b91c1c;
      border-radius: 22px 22px 0 0;
    }
    .eyes {
      display: flex;
      justify-content: space-between;
      width: 40px;
      position: absolute;
      top: 32px;
      left: 17px;
    }
    .eye {
      width: 9px;
      height: 9px;
      background: #0f172a;
      border-radius: 50%;
    }
    .mouth {
      width: 20px;
      height: 7px;
      background: #be123c;
      border-radius: 0 0 10px 10px;
      position: absolute;
      bottom: 16px;
      left: 27px;
      transition: all 0.15s ease;
    }
    
    .human-character.speaking .mouth {
      animation: speakAnimation 0.2s infinite alternate;
    }
    @keyframes speakAnimation {
      0% { height: 4px; border-radius: 50%; }
      100% { height: 15px; border-radius: 8px 8px 10px 10px; }
    }

    .body-shirt {
      width: 65px;
      height: 55px;
      border-radius: 12px 12px 0 0;
      margin-top: -5px;
      border: 3px solid #334155;
    }
    .mohamed .body-shirt { background: #0284c7; }
    .omar .body-shirt { background: #16a34a; }

    .char-title {
      margin-top: 8px;
      font-weight: bold;
      font-size: 17px;
      color: #1e293b;
    }

    /* فقاعة الكلام والملحوظات */
    .speech-bubble {
      background: #f8fafc;
      border: 3px solid #3b82f6;
      border-radius: 18px;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #0f172a;
      min-height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .note-box {
      font-size: 13px;
      color: #0369a1;
      background: #e0f2fe;
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
      font-weight: 600;
    }

    /* أزرار التحكم: التالي - إعادة النطق - السابق */
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-next { background: #2563eb; }
    .btn-repeat { background: #d97706; }
    .btn-prev { background: #64748b; }

    .btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn:active { transform: translateY(0); }
  </style>
</head>
<body class="split-theme">

  <!-- إعداد أ. عائشة إبراهيم -->
  <div class="header-author">إِعْدَادُ / أ. عَائِشَةَ إِبْرَاهِيمَ</div>

  <div class="sky-element"></div>
  <div class="moon-split"></div>
  <div class="stars"></div>

  <div class="app-card">
    <h1>تطبيق التَّحِيَّاتِ الْفَصِيحَةِ</h1>

    <div class="characters-stage">
      <!-- شخصية محمد -->
      <div id="char-mohamed" class="human-character mohamed active">
        <div class="head">
          <div class="hair-mohamed"></div>
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth"></div>
        </div>
        <div class="body-shirt"></div>
        <div class="char-title">مُحَمَّدٌ</div>
      </div>

      <!-- شخصية عمر -->
      <div id="char-omar" class="human-character omar">
        <div class="head">
          <div class="hair-omar"></div>
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth"></div>
        </div>
        <div class="body-shirt"></div>
        <div class="char-title">عُمَرُ</div>
      </div>
    </div>

    <!-- صندوق الكلام البدائي -->
    <div id="speech-bubble" class="speech-bubble">
      اضْغَطْ عَلَى "التَّالِي" لِلْبَدْءِ 🔊
    </div>

    <!-- ملحوظة تعليمية -->
    <div id="note-box" class="note-box" style="display: block;">
      💡 ملحوظة: تحية "السلام عليكم" تقال في الصباح والمساء وفي أي وقت!
    </div>

    <!-- أزرار التحكم بالترتيب المطلوب -->
    <div class="controls">
      <button class="btn btn-next" onclick="nextDialogue()">التَّالِي ➔</button>
      <button class="btn btn-repeat" onclick="repeatCurrent()">إِعَادَةُ النَّطْقِ 🔄</button>
      <button class="btn btn-prev" onclick="prevDialogue()">السَّابِقُ ⬅️</button>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    // جدول الحوار المشكول بدقة فائقة لضمان النطق الفصيح الصحيح
    const dialogue = [
      { speaker: "mohamed", text: "السَّلَامُ عَلَيْكُمْ!", theme: "split", note: true },
      { speaker: "omar", text: "وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللَّهِ!", theme: "split", note: true },
      { speaker: "mohamed", text: "صَبَاحُ الْخَيْرِ!", theme: "day", note: false },
      { speaker: "omar", text: "صَبَاحُ النُّورِ!", theme: "day", note: false },
      { speaker: "mohamed", text: "مَسَاءُ الْخَيْرِ!", theme: "night", note: false },
      { speaker: "omar", text: "مَسَاءُ النُّورِ!", theme: "night", note: false },
      { speaker: "mohamed", text: "مَا اسْمُكَ؟", theme: "day", note: false },
      { speaker: "omar", text: "اسْمِي مُحَمَّدٌ.. وَأَنْتَ مَا اسْمُكَ؟", theme: "day", note: false },
      { speaker: "mohamed", text: "اسْمِي عُمَرُ.", theme: "day", note: false },
      { speaker: "omar", text: "مَعَ السَّلَامَةِ.", theme: "day", note: false },
      { speaker: "mohamed", text: "مَعَ السَّلَامَةِ.", theme: "day", note: false }
    ];

    let currentIndex = -1;
    const audioPlayer = document.getElementById("audio-player");

    function updateStep(autoSpeak = true) {
      if (currentIndex < 0) currentIndex = 0;
      const current = dialogue[currentIndex];

      // 1. التحكم في الخلفيات
      document.body.className = current.theme + "-theme";

      // 2. إظهار الملحوظة عند تحية السلام عليكم
      const noteBox = document.getElementById("note-box");
      noteBox.style.display = current.note ? "block" : "none";

      // 3. تحديث النص المكتوب
      document.getElementById("speech-bubble").innerText = current.text;

      // 4. تبديل نشاط محمد وعمر
      const mohamed = document.getElementById("char-mohamed");
      const omar = document.getElementById("char-omar");

      mohamed.classList.remove("active", "speaking");
      omar.classList.remove("active", "speaking");

      const activeChar = current.speaker === "mohamed" ? mohamed : omar;
      activeChar.classList.add("active");

      // 5. التشغيل الصوتي النقائي الفصيح
      if (autoSpeak) {
        speakTextGoogle(current.text, activeChar);
      }
    }

    function nextDialogue() {
      if (currentIndex === -1) {
        currentIndex = 0;
      } else {
        currentIndex = (currentIndex + 1) % dialogue.length;
      }
      updateStep(true);
    }

    function prevDialogue() {
      if (currentIndex <= 0) {
        currentIndex = dialogue.length - 1;
      } else {
        currentIndex = currentIndex - 1;
      }
      updateStep(true);
    }

    function repeatCurrent() {
      if (currentIndex === -1) currentIndex = 0;
      updateStep(true);
    }

    // محرك النطق الفصيح الجديد المعتمد على خوادم الصوت السحابية المتقدمة
    function speakTextGoogle(text, activeChar) {
      // بناء رابط المحرك الصوتي الفصيح المباشر
      const googleTranslateTtsUrl = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(text) + "&tl=ar&client=tw-ob";

      audioPlayer.src = googleTranslateTtsUrl;

      // عند بدء تشغيل الصوت: تشغيل أنيميشن الفم
      audioPlayer.onplay = () => activeChar.classList.add("speaking");

      // عند انتهاء تشغيل الصوت: إيقاف أنيميشن الفم
      audioPlayer.onended = () => activeChar.classList.remove("speaking");

      // محاولة التشغيل
      const playPromise = audioPlayer.play();

      if (playPromise !== undefined) {
        playPromise.catch(error => {
          // بديل متطور في حال تم حظر تشغيل الصوت التلقائي من المتصفح
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.8;
            utterance.onstart = () => activeChar.classList.add("speaking");
            utterance.onend = () => activeChar.classList.remove("speaking");
            window.speechSynthesis.speak(utterance);
          }
        });
      }
    }
  </script>
</body>
</html>
